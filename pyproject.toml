[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipstraw-mm"
version = "0.1.0"
description = "Find and review real target companies for one micro-market"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "google-cloud-firestore",
    "httpx",
    "beautifulsoup4",
    "pydantic>=2",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
    "mypy",
]

[project.scripts]
hipstraw-mm = "hipstraw_mm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hipstraw_mm"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
markers = [
    "emulator: requires the Firestore emulator (deselected by default)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
