[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipstraw-mm"
version = "0.1.0"
description = "Find and review real target companies for one micro-market"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "google-cloud-firestore",
    "httpx",
    "beautifulsoup4",
    "pydantic>=2",
    "PyYAML",
    "python-dotenv",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
    "mypy",
]

[project.scripts]
hipstraw-mm = "hipstraw_mm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hipstraw_mm"]

[tool.hatch.build.targets.wheel.force-include]
"src/hipstraw_mm/viewer/static" = "hipstraw_mm/viewer/static"
"src/hipstraw_mm/prompts" = "hipstraw_mm/prompts"

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
markers = [
    "emulator: requires the Firestore emulator (deselected by default)",
    "viewer: starts the read-only viewer on 127.0.0.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# Model fields are camelCase because they are the stored Firestore field names (data-model.md).
ignore = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["hipstraw_mm", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
