/* ---------- routing: the task router replayed from the trace ---------- */

const RT_TRACKS = {
  "in-router": "M150 190 H190", "router-rules": "M345 150 H372 V52 H410", "rules-save": "M560 52 H880 V160",
  "router-ow": "M345 160 H410", "ow-val": "M560 160 H610", "val-save": "M790 160 H805 V176 H820",
  "val-fr": "M685 195 V280", "ow-fr": "M485 195 V292 H610", "router-fr": "M345 228 H372 V326 H610",
  "fr-save": "M760 310 H790 V214 H820",
};
const RT_RULES = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"];
const RT_CHECKS = [["schema", "FORM"], ["echo_key", "ECHO"], ["grounding", "GROUND"], ["abstention", "ABSTAIN"]];
const RT_LAMP = { schema: "FORM", echo_key: "ECHO", grounding: "GROUND", abstention: "ABSTAIN", coverage: "COVER",
  rationale: "REASON", path_echo: "UNIT", evidence_ids: "EVID", one_company: "1 CO.", queries: "QUERIES",
  metros: "METROS", link_ids: "LINKS", excerpts: "QUOTES", consistency: "CONSIST", homepage_excerpt: "QUOTE" };
function rtLamps(e, rubric) {
  const spec = rubric && rubric.tasks && rubric.tasks[e.task];
  if (!spec) return e.task === "vichara.v1" ? RT_CHECKS : [];
  const tiers = Object.fromEntries((rubric.checks || []).map(c => [c.id, c.tiers]));
  return spec.checks.filter(id => (tiers[id] || []).includes("open_weight")).map(id => [id, RT_LAMP[id] || id.toUpperCase()]);
}
const RT_VERDICT = { near_miss: ["partial", "near miss"], partial: ["partial", "partial match"], not_found: ["fail", "not found"] };
const rtVal = (e, tier) => (e.validation && e.validation[tier]) || null;
const RT_MS = { enter: 350, move: 650, router: 500, node: 650, checks: 750, escalate: 450, save: 700 };
const RT_REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const rtCheck = c => { const i = c.name.indexOf("."); return [c.name.slice(0, i), c.name.slice(i + 1)]; };
const rtShort = e => ({ repair_deliberation: "repair", judge_coverage: "coverage", propose_hypotheses: "propose" }[e.operation]
  || String(e.subject || "").replace(/_/g, " "));
const rtSecs = ms => ms != null && ms < 50 ? "replayed" : fmt.ms(ms);
const rtTier = t => t === "open_weight" ? "open-weight" : t;
const rtStage = st => STAGE_LABEL[COMMAND_STATUS[st]] || st || "";

function rtBeats(e) {
  const b = [{ k: "enter" }, { k: "move", t: "in-router", c: "esc" }, { k: "router" }];
  const ow = e.attempts.find(a => a.tier === "open_weight");
  const fr = e.attempts.find(a => a.tier === "frontier");
  const route = e.router ? e.router.route : "frontier";
  if (route === "open_weight" && ow) {
    b.push({ k: "move", t: "router-ow", c: "ow" }, { k: "node", n: "ow", a: ow });
    const formFail = (rtVal(e, "open_weight") || []).some(c => c.id === "schema" && !c.passed);
    if (ow.status !== "ok" && !formFail) b.push({ k: "move", t: "ow-fr", c: "esc" }, { k: "escalate" });
    else {
      b.push({ k: "move", t: "ow-val", c: "ow" }, { k: "checks" });
      if (e.outcome.escalated) b.push({ k: "move", t: "val-fr", c: "esc" }, { k: "escalate" });
      else b.push({ k: "move", t: "val-save", c: "ow" });
    }
    if (e.outcome.escalated && fr) b.push({ k: "node", n: "fr", a: fr }, { k: "move", t: "fr-save", c: "fr" });
  } else if (route === "rules") {
    b.push({ k: "move", t: "router-rules", c: "rules" }, { k: "move", t: "rules-save", c: "rules" });
  } else {
    b.push({ k: "move", t: "router-fr", c: "fr" });
    if (fr) b.push({ k: "node", n: "fr", a: fr });
    b.push({ k: "move", t: "fr-save", c: "fr" });
  }
  b.push({ k: "save" });
  return b;
}

function rtOutcome(e) {
  if (!e.routed) return "nr";
  if (e.outcome.servedBy === "rules") return "rules";
  if (e.outcome.escalated) return "esc";
  return e.outcome.servedBy === "open_weight" ? "kept" : "dir";
}

function rtFailed(e, tier) {
  return e.checks.filter(c => rtCheck(c)[0] === tier && c.status === "fail").map(c => rtCheck(c)[1]);
}

function RoutingView({ runId, live }) {
  const st = usePoll(`/api/runs/${enc(runId)}/routing`, live ? 5000 : 0, live);
  if (st.error && !st.data) return html`<${Empty} title="Routing not available" hint=${st.error} />`;
  if (!st.data) return html`<${Empty} title="Loading…" />`;
  const sim = st.data;
  if (!(sim.walkthrough || []).some(e => e.routed)) {
    return html`<${Empty} title="No routed tasks in this run"
      hint=${html`Runs from before the task router have none. To see routing on a program, run <code>hipstraw-mm market --memory simulate --program invoice_alpha_genesis --serve</code>`} />`;
  }
  return html`<${RoutingReplay} key=${sim.runId} sim=${sim} runId=${runId} />`;
}

function RoutingReplay({ sim, runId }) {
  const entries = sim.walkthrough;
  const n = entries.length;
  const featured = Math.max(0, entries.findIndex(e => e.outcome && e.outcome.escalated));
  const [pos, setPos] = useState({ idx: featured, upto: n, beat: Infinity });
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(2);
  const [stageFilter, setStageFilter] = useState("all");
  const tokRef = useRef(null);
  const animRef = useRef(null);
  const idx = Math.min(pos.idx, n - 1);
  const e = entries[idx];
  const beats = useMemo(() => rtBeats(e), [e]);
  const shown = playing ? beats.slice(0, pos.beat) : beats;
  // A live run adds tasks: keep them counted when the replay was showing everything.
  const prevN = useRef(n);
  useEffect(() => {
    if (!playing && pos.upto >= prevN.current) setPos(p => ({ ...p, upto: n }));
    prevN.current = n;
  }, [n]);

  useEffect(() => {
    if (!playing) return undefined;
    if (pos.beat >= beats.length) {
      const t = setTimeout(() => {
        if (pos.idx + 1 < n) setPos({ idx: pos.idx + 1, upto: pos.idx + 1, beat: 0 });
        else { setPos({ idx: pos.idx, upto: n, beat: Infinity }); setPlaying(false); }
      }, 250 / speed);
      return () => clearTimeout(t);
    }
    const b = beats[pos.beat];
    const ms = RT_MS[b.k] / speed;
    const advance = () => setPos(p => ({ ...p, beat: p.beat + 1 }));
    if (b.k !== "move" || RT_REDUCED) {
      const t = setTimeout(advance, b.k === "move" ? ms * 0.3 : ms);
      return () => clearTimeout(t);
    }
    const tok = tokRef.current, path = animRef.current;
    path.setAttribute("d", RT_TRACKS[b.t]);
    path.setAttribute("class", `rt-lit ${b.c}`);
    tok.setAttribute("class", `rt-tok ${b.c}`);
    const len = path.getTotalLength();
    path.style.strokeDasharray = `${len} ${len}`;
    path.style.strokeDashoffset = `${len}`;
    let stop = false;
    const done = () => { if (!stop) { stop = true; advance(); } };
    // Animation frames stop in background tabs; the timer keeps the replay moving.
    const timer = setTimeout(done, ms + 120);
    const t0 = performance.now();
    const frame = now => {
      if (stop) return;
      const k = Math.min(1, (now - t0) / ms);
      const q = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = path.getPointAtLength(q * len);
      tok.setAttribute("cx", pt.x); tok.setAttribute("cy", pt.y);
      path.style.strokeDashoffset = `${len * (1 - q)}`;
      if (k < 1) requestAnimationFrame(frame); else done();
    };
    requestAnimationFrame(frame);
    return () => {
      stop = true; clearTimeout(timer);
      path.setAttribute("d", ""); tok.setAttribute("cx", -30); tok.setAttribute("cy", -30);
    };
  }, [playing, pos, beats, speed, n]);

  const play = () => {
    setPos(pos.upto >= n ? { idx: 0, upto: 0, beat: 0 } : { idx, upto: idx, beat: 0 });
    setPlaying(true);
  };
  const pause = () => { setPlaying(false); setPos(p => ({ ...p, upto: Math.max(p.upto, p.idx + 1), beat: Infinity })); };
  const jump = i => { setPlaying(false); setPos({ idx: Math.max(0, Math.min(n - 1, i)), upto: Math.max(0, Math.min(n - 1, i)) + 1, beat: Infinity }); };
  const showAll = () => { setPlaying(false); setPos({ idx: featured, upto: n, beat: Infinity }); };

  const done = entries.slice(0, pos.upto);
  const count = k => done.filter(x => rtOutcome(x) === k).length;
  const sum = (list, f) => list.reduce((a, x) => a + (f(x) || 0), 0);
  const owUsd = sum(done, x => sum(x.attempts.filter(a => a.tier === "open_weight"), a => a.usd));
  const frUsd = sum(done, x => sum(x.attempts.filter(a => a.tier === "frontier"), a => a.usd));
  const allUsd = sum(done, x => x.allFrontierUsd);
  const scale = Math.max(sum(entries, x => x.costUsd), sum(entries, x => x.allFrontierUsd), 1e-9);
  const pct = v => `${(100 * v / scale).toFixed(2)}%`;
  const saved = allUsd - owUsd - frUsd;

  const docs = (sim.objective && sim.objective.documents) || [];
  const stages = [...new Set(entries.map(x => x.stage))];
  const controls = html`<div className="rt-controls">
    <button className="chip" onClick=${() => jump(0)} title="First task" aria-label="First task">⏮</button>
    <button className="chip" onClick=${() => jump(idx - 1)} title="Previous task" aria-label="Previous task">◀</button>
    <button className="rt-play" onClick=${playing ? pause : play}>${playing ? "❚❚ Pause" : pos.upto >= n ? "▶ Replay" : "▶ Play"}</button>
    <button className="chip" onClick=${() => jump(idx + (playing ? 0 : 1))} title="Next task" aria-label="Next task">▶</button>
    <button className="chip" onClick=${showAll} title="Show every task" aria-label="Show every task">⏭</button>
    <span className="seg">${[1, 2, 4].map(s => html`<button key=${s} className=${speed === s ? "on" : ""} onClick=${() => setSpeed(s)}>${s}×</button>`)}</span>
    <span className="rt-pos">${idx + 1} / ${n}</span>
  </div>`;

  return html`<div className="stack">
    <${Card} title="Task routing" right=${controls}
      hint=${html`<div>${n} tasks in ${stages.length} stage(s) (${stages.map(rtStage).join(", ")}) read back from this run's trace · ${sim.routerVersion}. The route is chosen by rules in config/routing.yaml, never by a model.</div>
        <div className="rt-chips">
          <span className="rt-chip"><i style=${{ background: "var(--tier-ow)" }}></i>open-weight <b>${(sim.openWeight && sim.openWeight.model) || "none configured"}</b></span>
          <span className="rt-chip"><i style=${{ background: "var(--tier-fr)" }}></i>frontier <b>${(sim.frontier && sim.frontier.model) || "—"}</b></span>
          <span className="rt-chip">open-weight route <b>${sim.openWeightRouteOn ? "on" : "off"}</b></span>
          ${docs.length ? html`<span className="rt-chip">objective <b>${fmt.num(sim.objective.chars)} chars</b> · ${docs.map(d => `${d.fileName} (${d.pages} pages)`).join(", ")}</span>` : null}
        </div>`} flush>
      <div className="rt-top">
        <div>
          <div className="rt-dia"><${RtDiagram} e=${e} shown=${shown} sim=${sim} tokRef=${tokRef} animRef=${animRef} /></div>
          <div className="legend rt-legend">
            <span><span className="sw" style=${{ background: "var(--tier-ow)" }}></span>open-weight</span>
            <span><span className="sw" style=${{ background: "var(--tier-fr)" }}></span>frontier</span>
            <span><span className="sw" style=${{ background: "var(--tier-esc)" }}></span>router decision, escalation</span>
            <span><span className="sw" style=${{ background: "var(--tier-rules)" }}></span>rules</span>
          </div>
        <div className="rt-figs">
          ${[["kept", "Kept on open-weight", "var(--tier-ow)"], ["esc", "Escalated to frontier", "var(--tier-esc)"],
             ["dir", "Straight to frontier", "var(--tier-fr)"], ["rules", "Answered by rules", "var(--tier-rules)"],
             ["nr", "Not routed yet", "var(--faint)"]].map(([k, label, color]) => html`
            <section key=${k} className="rt-fig stat"><div className="label"><span className="dot" style=${{ background: color }}></span>${label}</div><div className="value">${count(k)}</div></section>`)}
          <section className="rt-cost">
            <div className="stat"><div className="label">Cost of the routed tasks</div></div>
            <div className="rt-mrow"><span>With routing</span><span className="rt-meter"><span style=${{ width: pct(owUsd), background: "var(--tier-ow)" }}></span><span style=${{ width: pct(frUsd), background: "var(--tier-fr)" }}></span></span><span className="rt-mval">$${(owUsd + frUsd).toFixed(3)}</span></div>
            <div className="rt-mrow"><span>All on frontier</span><span className="rt-meter"><span style=${{ width: pct(allUsd), background: "var(--faint)" }}></span></span><span className="rt-mval">$${allUsd.toFixed(3)}</span></div>
            <div className="muted">${allUsd > 0 ? html`${saved >= 0 ? "Saved" : "Extra"} <b style=${{ color: "var(--fg)" }}>$${Math.abs(saved).toFixed(3)}</b> (${Math.abs(Math.round(100 * saved / allUsd))}%) so far · open-weight $${owUsd.toFixed(3)} · frontier $${frUsd.toFixed(3)}` : "Nothing routed yet."}</div>
          </section>
        </div>
        </div>
        <${RtNow} e=${e} idx=${idx} shown=${shown} runId=${runId} rubric=${sim.validationRubric} />
      </div>
    <//>

    <${RtRubric} rubric=${sim.validationRubric} current=${e.task} />

    <${Card} title="Tasks" hint="Click a task to see its route and validation log; the step numbers open each model call in Activity."
      right=${stages.length > 1 ? html`<div className="rt-filter">${["all", ...stages].map(st => html`<button key=${st} className=${`chip ${stageFilter === st ? "on" : ""}`} onClick=${() => setStageFilter(st)}>${st === "all" ? "All stages" : rtStage(st)}</button>`)}</div>` : null} flush>
      <div style=${{ overflowX: "auto" }}><table>
        <thead><tr><th className="num">#</th><th>Stage</th><th>Task</th><th>Prompt</th><th>Rule</th><th>Route taken</th><th>Validation</th><th>Saved</th><th className="num">Cost</th><th className="num">All frontier</th><th>Steps</th></tr></thead>
        <tbody>${entries.map((x, i) => {
          if (stageFilter !== "all" && x.stage !== stageFilter) return null;
          const ow = x.attempts.find(a => a.tier === "open_weight");
          const fr = x.attempts.find(a => a.tier === "frontier");
          const failed = rtFailSummary(x);
          const kind = rtOutcome(x);
          const items = Object.entries(x.saved.items || {}).map(([k, v]) => `${v} ${k}`).join(", ");
          return html`<tr key=${i} className=${`rt-row ${i === idx ? "cur" : ""} ${i >= pos.upto && i !== idx ? "pending" : ""}`} onClick=${() => jump(i)}>
            <td className="num">${i + 1}</td>
            <td className="rt-stage">${rtStage(x.stage)}</td>
            <td><div style=${{ fontWeight: 550 }}>${rtShort(x)}</div><div className="mono muted">${x.task}</div></td>
            <td className="num muted">${x.inputChars ? fmt.num(x.inputChars) : "—"}</td>
            <td className="mono">${x.router ? x.router.ruleId : "—"}</td>
            <td><span className="rt-path">
              ${ow ? html`<span className=${`rt-tier ow ${kind === "esc" ? "x" : ""}`}>open-weight</span>` : null}
              ${ow && fr ? html`<span className="muted">→</span>` : null}
              ${fr ? html`<span className="rt-tier fr">frontier</span>` : null}
              ${kind === "rules" ? html`<span className="rt-tier rules">rules</span>` : null}
              ${!x.routed ? html`<span className="muted">not routed</span>` : null}
            </span></td>
            <td>${kind === "rules" ? html`<span className="muted">rule ${x.rule || ""}</span>`
              : ow && ow.status !== "ok" && !failed.length ? html`<${Pill} value="fail">call failed<//>`
              : failed.length ? failed.map(f => html`<${Pill} key=${f} value="fail">${f}<//>`)
              : ow ? html`<${Pill} value="pass">pass<//>` : html`<span className="muted">—</span>`}</td>
            <td className="muted">${items}</td>
            <td className="num">${fmt.usd(x.costUsd)}</td>
            <td className="num muted">${fmt.usd(x.allFrontierUsd)}</td>
            <td>${x.attempts.map(a => a.seq != null ? html`<a key=${a.seq} href=${href(runId, "trace", a.seq)} onClick=${ev => ev.stopPropagation()} className="mono" style=${{ marginRight: 6 }}>#${a.seq}</a>` : null)}</td>
          </tr>`;
        })}</tbody>
      </table></div>
    <//>

    <${Card} title="Rubric" hint="Where every model task goes by its class in config/routing.yaml. Only wired tasks run through the router today." flush>
      <div style=${{ overflowX: "auto" }}><table>
        <thead><tr><th>Task</th><th>Class</th><th>Wired</th><th>Rule</th><th>Route</th><th>Why</th></tr></thead>
        <tbody>${(sim.rubric || []).map(r => html`<tr key=${r.task}>
          <td className="mono" style=${{ fontWeight: r.wired ? 600 : 400 }}>${r.task}</td>
          <td>${r.class}</td>
          <td>${r.wired ? html`<${Pill} value="ok">wired<//>` : html`<span className="muted">not yet</span>`}</td>
          <td className="mono">${r.ruleId}</td>
          <td>${r.route === "open_weight" ? html`<span className="rt-tier ow">open-weight</span>` : r.route === "frontier" ? html`<span className="rt-tier fr">frontier</span>` : html`<${Pill} value="warn">rules<//>`}</td>
          <td className="muted">${r.why}</td>
        </tr>`)}</tbody>
      </table></div>
    <//>
  </div>`;
}

function RtDiagram({ e, shown, sim, tokRef, animRef }) {
  const lit = shown.filter(b => b.k === "move");
  const has = k => shown.some(b => b.k === k);
  const last = [...shown].reverse().find(b => b.k !== "move");
  const active = !last ? null : last.k === "enter" ? "in" : last.k === "router" ? "router"
    : last.k === "node" ? last.n : last.k === "checks" ? "val" : last.k === "escalate" ? "fr" : "save";
  const node = (id, x, y, w, h, label, sub, dim, sub2) => html`<g className=${`rt-node ${active === id ? "on" : ""} ${dim ? "dim" : ""}`}>
    <rect x=${x} y=${y} width=${w} height=${h} rx="7" />
    <text className="rt-nl" x=${x + 14} y=${y + 24}>${label}</text>
    ${sub ? html`<text className="rt-ns" x=${x + 14} y=${y + 42}>${sub}</text>` : null}
    ${sub2 ? html`<text className="rt-ns" x=${x + 14} y=${y + 58}>${sub2}</text>` : null}
  </g>`;
  const ruleOn = has("router") && e.router ? e.router.ruleId : null;
  const checks = {};
  if (has("checks")) e.checks.forEach(c => { const [tier, name] = rtCheck(c); if (tier === "open_weight") checks[name] = c.status; });
  const served = e.outcome ? e.outcome.servedBy : "frontier";
  return html`<svg viewBox="0 0 960 360" role="img" aria-label="Routing diagram: incoming task, router, rules, open-weight, validation, frontier, saved">
    ${Object.entries(RT_TRACKS).map(([k, d]) => html`<path key=${k} className="rt-track" d=${d} />`)}
    ${lit.map(b => html`<path key=${"l" + b.t} className=${`rt-lit ${b.c}`} d=${RT_TRACKS[b.t]} />`)}
    <path ref=${animRef} className="rt-lit" d="" />
    <text className="rt-tl" x="793" y="150">PASS</text>
    <text className="rt-tl" x="693" y="243">ESCALATE</text>
    <text className="rt-tl" x="493" y="245">CALL FAILED</text>
    <text className="rt-tl" x="380" y="318">COMPLEX OR NOT WIRED</text>
    ${node("in", 20, 160, 130, 60, "INCOMING", rtShort(e).slice(0, 18))}
    <g className=${`rt-node ${active === "router" ? "on" : ""}`}>
      <rect x="190" y="120" width="155" height="140" rx="7" />
      <text className="rt-nl" x="204" y="144">ROUTER</text>
      <text className="rt-ns" x="204" y="161">rules, no model call</text>
      ${RT_RULES.map((r, i) => {
        const x = 214 + (i % 4) * 36, y = 192 + Math.floor(i / 4) * 40;
        return html`<g key=${r}><circle className=${`rt-lamp ${ruleOn === r ? "on" : ""}`} cx=${x} cy=${y} r="8" /><text className="rt-lt" x=${x - 7} y=${y + 21}>${r}</text></g>`;
      })}
    </g>
    ${node("rules", 410, 24, 150, 56, "RULES", "code answers, no model", !(e.router && e.router.route === "rules"))}
    ${node("ow", 410, 125, 150, 70, "OPEN-WEIGHT", (sim.openWeight && sim.openWeight.model) || "none")}
    <g className=${`rt-node ${active === "val" ? "on" : ""}`}>
      <rect x="610" y="125" width="180" height="70" rx="7" />
      <text className="rt-nl" x="624" y="149">VALIDATION</text>
      ${rtLamps(e, sim.validationRubric).map(([k, label], i) => {
        const x = 634 + i * 44, y = 166;
        return html`<g key=${k}><circle className=${`rt-lamp ${checks[k] || ""}`} cx=${x} cy=${y} r="7" /><text className="rt-lt" x=${x} y=${y + 20} textAnchor="middle">${label}</text></g>`;
      })}
    </g>
    ${node("fr", 610, 280, 150, 60, "FRONTIER", (sim.frontier && sim.frontier.model) || "")}
    ${node("save", 820, 160, 125, 70, "SAVED", "+ lineage", false, has("save") ? `by ${rtTier(served)}` : null)}
    <circle ref=${tokRef} className="rt-tok esc" r="8" cx="-30" cy="-30" />
  </svg>`;
}

function RtSaid({ ans }) {
  if (!ans) return null;
  return html`<div className="rt-said">
    <div className="eyebrow">${ans.status || ""}</div>
    <div className="ans" title=${ans.answer || ans.reason || ""}>${ans.answer || ans.reason || "no answer"}</div>
    ${ans.basis ? html`<div className="quote" title=${ans.basis}>“${ans.basis}”</div>` : null}
  </div>`;
}

function RtAttempt({ a, runId }) {
  const step = a.seq != null ? html` · <a href=${href(runId, "trace", a.seq)}>step #${a.seq}</a>` : null;
  if (a.status !== "ok") {
    return html`<div><b>${a.model || "?"}</b> failed after ${rtSecs(a.latencyMs)}${step}<div className="muted" style=${{ marginTop: 4 }}>${(a.error || "").slice(0, 200)}</div></div>`;
  }
  return html`<div><b>${a.model || "?"}</b> · ${rtSecs(a.latencyMs)} · ${fmt.num(a.inputTokens)} in / ${fmt.num(a.outputTokens)} out · ${fmt.usd(a.usd)}${step}
    <${RtSaid} ans=${a.answer} /></div>`;
}

function RtChecks({ e, tier }) {
  const mine = e.checks.filter(c => rtCheck(c)[0] === tier);
  if (!mine.length) return null;
  return html`<div>
    <div className="rt-pills">${mine.map(c => html`<${Pill} key=${c.name} value=${c.status}>${c.status === "pass" ? "✓" : "✕"} ${rtCheck(c)[1]}<//>`)}</div>
    ${mine.filter(c => c.status === "fail").map(c => html`<div key=${c.name} className="muted" style=${{ marginTop: 4 }}>${rtCheck(c)[1]}: ${c.reason}</div>`)}
  </div>`;
}

function rtFailSummary(x) {
  const v = rtVal(x, "open_weight");
  if (!v) return rtFailed(x, "open_weight");
  return v.filter(c => !c.passed).map(c => {
    if (c.id !== "grounding") return c.id;
    const verdicts = [...new Set(((c.details && c.details.quotes) || []).filter(q => !q.found && q.diagnosis)
      .map(q => (RT_VERDICT[q.diagnosis.verdict] || ["", q.diagnosis.verdict])[1]))];
    return verdicts.length ? `grounding · ${verdicts.join(", ")}` : "grounding";
  });
}

function RtPassage({ d }) {
  const odd = new Set((d.characters || []).map(c => c.char));
  let word = 0;
  return html`<div className="rt-passage">${(d.closest || "").split(/(\s+)/).map((part, i) => {
    if (!part || /^\s+$/.test(part)) return part;
    word += 1;
    const hit = (d.differs && d.differs.passageWord === word) || [...part].some(ch => odd.has(ch));
    return hit ? html`<mark key=${i}>${part}</mark>` : part;
  })}</div>`;
}

function RtQuote({ q }) {
  const d = q.diagnosis;
  const verdict = d ? (RT_VERDICT[d.verdict] || ["fail", d.verdict]) : null;
  return html`<li>
    <div><span className=${q.found ? "ico-ok" : "ico-fail"}>${q.found ? "✓" : "✕"}</span> <span className="muted">item ${q.item}</span> <span className="rt-qtext">“${q.quote}”</span>
      ${q.found ? html` <span className="muted">· found word for word</span>` : html` <${Pill} value=${verdict[0]}>${verdict[1]}<//>`}</div>
    ${d ? html`<div className="rt-diag">
      <div>${d.explanation}</div>
      ${d.closest ? html`<div className="muted">Closest passage in ${d.location} · ${d.matchedWords} of ${d.quoteWords} words match</div><${RtPassage} d=${d} />` : null}
      ${d.differs ? html`<div>First difference at quote word ${d.differs.position} (${d.differs.kind}): quote <code>${d.differs.quote || "—"}</code> · document <code>${d.differs.document || "—"}</code></div>` : null}
      ${(d.characters || []).map(c => html`<div key=${c.code}>Character <code>${c.code}</code> (${c.kind}) in the document word <code>${c.documentWord}</code>; the quote has <code>${c.quoteWord}</code></div>`)}
    </div>` : null}
  </li>`;
}

function RtValidationLog({ e, tier, rubric }) {
  const log = rtVal(e, tier);
  if (!log) return html`<${RtChecks} e=${e} tier=${tier} />`;
  const byId = Object.fromEntries(((rubric && rubric.checks) || []).map(c => [c.id, c]));
  return html`<div className="rt-vlog">${log.map(c => {
    const r = byId[c.id] || {};
    const d = c.details || {};
    let body = null;
    if (c.id === "schema") body = c.passed ? null : html`<div className="rt-small">${c.reason}</div>`;
    else if (c.id === "echo_key") body = html`<div className="rt-small">Asked <code>${d.asked}</code>, answered <code>${d.answered}</code></div>`;
    else if (c.id === "grounding") {
      body = html`<div>
        <div className="rt-small muted">${d.checked ? `${d.checked} quote(s) checked in ${d.itemsKept} kept item(s); ${d.failed} not found` : `No quotes to check: none of the ${d.itemsKept || 0} kept item(s) is answered.`}</div>
        ${(d.quotes || []).length ? html`<ul className="rt-quotes">${d.quotes.map((q, i) => html`<${RtQuote} key=${i} q=${q} />`)}</ul>` : null}
      </div>`;
    } else if (c.id === "abstention") {
      body = html`<div className="rt-small">${d.unresolved} of ${d.itemsKept} kept item(s) say there is no information${(d.reasons || []).length ? html`: “${d.reasons[0]}”` : ""} · documents attached: ${d.documentsAttached ? "yes" : "no"}</div>`;
    } else if (c.id === "coverage") {
      body = html`<div className="rt-small">${d.returned} verdict(s) for ${d.expected} link(s) sent
        ${[["missing", "Missing"], ["repeated", "Answered twice"], ["unknown", "Not asked about"]].map(([k, label]) => (d[k] || []).length
          ? html`<div key=${k}><b>${label}:</b><ul className="rt-list">${d[k].slice(0, 8).map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></div>` : null)}</div>`;
    } else if (c.id === "rationale") {
      body = html`<div className="rt-small">${d.short ? html`${d.short} verdict(s) with fewer than ${d.minWords} words of reason:<ul className="rt-list">${(d.links || []).map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>` : `every verdict has at least ${d.minWords || 3} words of reason`}</div>`;
    } else if (c.id === "path_echo") {
      body = html`<div className="rt-small">Asked <code>${d.asked}</code>${(d.other || []).length ? html`; roles also name <code>${d.other.join(", ")}</code>` : ", every role matches"}</div>`;
    } else if (c.id === "evidence_ids") {
      body = html`<div className="rt-small">${d.roles} role(s) checked against ${d.sent} evidence document(s) sent${(d.unknown || []).length ? html`; not sent: <code>${d.unknown.join(", ")}</code>` : ""}</div>`;
    } else if (c.id === "one_company") {
      body = html`<div className="rt-small">${(d.mixed || []).length ? `Role(s) ${d.mixed.join(", ")} cite evidence from more than one company` : `each of the ${d.roles} role(s) cites one company`}</div>`;
    } else if (c.id === "queries") {
      body = html`<div className="rt-small">${d.returned} quer${d.returned === 1 ? "y" : "ies"} (limit ${d.max})${d.empty ? `, ${d.empty} blank` : ""}${(d.duplicates || []).length ? html`; repeated: <code>${d.duplicates.join(" | ")}</code>` : ""}</div>`;
    } else if (c.id === "metros") {
      body = html`<div className="rt-small">${(d.missing || []).length ? html`Not named by any query:<ul className="rt-list">${d.missing.map((m, i) => html`<li key=${i}>${m}</li>`)}</ul>` : `all ${d.metros} metros named`}</div>`;
    } else if (c.id === "link_ids") {
      body = html`<div className="rt-small">${d.companies} compan${d.companies === 1 ? "y" : "ies"} listed${(d.unknown || []).length ? html`; linkIds not on the page: <code>${d.unknown.join(", ")}</code>` : ", every linkId is on the page"}</div>`;
    } else if (c.id === "excerpts") {
      body = html`<div className="rt-small">${d.quoted} of ${d.companies} quoted from the page${(d.notFound || []).length ? html`; not quoted: ${d.notFound.join(", ")}` : ""}</div>`;
    } else if (c.id === "consistency") {
      body = html`<div className="rt-small">Verdict: ${d.isCompanyHomepage ? "a company homepage" : "not a homepage"} · name ${d.name ? html`<code>${d.name}</code>` : "none"} · excerpt ${d.hasExcerpt ? "given" : "none"}</div>`;
    } else if (c.id === "homepage_excerpt") {
      body = html`<div className="rt-small">${c.reason}${d.excerpt ? html`<div className="quote">“${d.excerpt}”</div>` : null}</div>`;
    } else if (!c.passed) body = html`<div className="rt-small">${c.reason}</div>`;
    return html`<div key=${c.id} className=${`rt-vcheck ${c.passed ? "pass" : "fail"}`}>
      <div className="rt-vhead"><span className=${c.passed ? "ico-ok" : "ico-fail"}>${c.passed ? "✓" : "✕"}</span>
        <b>${r.name || c.id}</b><span className="mono muted">${c.id}</span>
        ${c.passed ? null : c.blocking === false ? html`<${Pill} value="partial">warning · kept<//>`
          : html`<${Pill} value="fail">${tier === "frontier" ? "failed · recorded only" : "failed · escalate"}<//>`}</div>
      ${r.question ? html`<div className="rt-small muted">${r.question}${!c.passed && r.method ? html` <span className="rt-method">How: ${r.method}.</span>` : null}</div>` : null}
      ${body}
    </div>`;
  })}</div>`;
}

function RtRubric({ rubric, current }) {
  const tasks = Object.keys((rubric && rubric.tasks) || {});
  const [chosen, setChosen] = useState(null);
  if (!rubric || !tasks.length) return null;
  const task = chosen || (tasks.includes(current) ? current : tasks[0]);
  const byId = Object.fromEntries(rubric.checks.map(c => [c.id, c]));
  const rules = Object.fromEntries(rubric.rules.map(r => [r.id, r]));
  const spec = rubric.tasks[task];
  return html`<${Card} title="Validation rubric" hint=${`${rubric.version} · rules only (string, schema, set and status matching), never a model call · config/validation.yaml`}
    right=${html`<div className="rt-filter">${tasks.map(t => html`<button key=${t} className=${`chip ${t === task ? "on" : ""}`} onClick=${() => setChosen(t)}>${t}</button>`)}</div>`} flush>
    <div className="card-body"><div className="quote" style=${{ fontSize: 13, marginTop: 0 }}>${rubric.analogy}</div></div>
    ${spec.rules.length ? html`<div className="card-body tight" style=${{ paddingTop: 0 }}>${spec.rules.map(id => html`<div key=${id}>
      <span className="rt-tier rules">rule</span> <b>${(rules[id] || {}).name || id}</b> <span className="mono muted">${id}</span>
      <div className="rt-small"><b>When:</b> ${(rules[id] || {}).when}</div>
      <div className="rt-small"><b>Then:</b> ${(rules[id] || {}).result}</div></div>`)}</div>` : null}
    <div style=${{ overflowX: "auto" }}><table className="rt-rubric">
      <thead><tr><th>Check</th><th>Question it asks</th><th>How it is tested</th><th>Passes when</th><th>If it fails</th><th>Applies to</th></tr></thead>
      <tbody>${spec.checks.map(id => byId[id]).filter(Boolean).map(c => html`<tr key=${c.id}>
        <td style=${{ whiteSpace: "nowrap" }}><b>${c.name}</b><div className="mono muted">${c.id}</div></td>
        <td className="wrap">${c.question}</td>
        <td className="wrap muted">${c.method}</td>
        <td className="wrap">${c.passWhen}</td>
        <td className="wrap">${c.onFail}</td>
        <td style=${{ whiteSpace: "nowrap" }}>${c.tiers.map(rtTier).join(", ")}${c.blocking === false ? html`<div><${Pill} value="partial">warning only<//></div>` : null}</td>
      </tr>`)}</tbody>
    </table></div>
    <div className="card-body tight">
      <div><b>After a failure.</b> ${rubric.escalation}</div>
      ${spec.checks.includes("grounding") ? html`<div><b>Grounding verdicts</b> (shown for every quote that is not found):
        ${Object.entries(rubric.groundingVerdicts).map(([k, v]) => html`<div key=${k} className="rt-small"><${Pill} value=${(RT_VERDICT[k] || ["", k])[0]}>${(RT_VERDICT[k] || ["", k])[1]}<//> ${v}</div>`)}
      </div>` : null}
    </div>
  <//>`;
}

function RtNow({ e, idx, shown, runId, rubric }) {
  const sec = (key, title, dot, body) => html`<div key=${key} className="dsec"><h3><span className=${`dot ${dot || ""}`}></span>${title}</h3>${body}</div>`;
  const names = Object.fromEntries(((rubric && rubric.checks) || []).map(c => [c.id, c.name]));
  const ow = e.attempts.find(a => a.tier === "open_weight");
  const fr = e.attempts.find(a => a.tier === "frontier");
  const out = [];
  for (const b of shown) {
    if (b.k === "router") {
      out.push(sec("router", "Router", "esc", e.router
        ? html`<div><b className="mono">${e.router.ruleId}</b> ${e.router.why} → ${rtTier(e.router.route)}</div>`
        : html`<div>Not wired to the router yet: stays on frontier, as before.</div>`));
      if (e.router && e.router.route === "rules") {
        const id = e.rule;
        const r = ((rubric && rubric.rules) || []).find(x => x.id === id) || {};
        out.push(sec("rules", "Rules", "", html`<div>
          <div><span className="rt-tier rules">rule</span> <b>${r.name || id}</b> <span className="mono muted">${id}</span></div>
          ${r.when ? html`<div className="rt-small"><b>When:</b> ${r.when}</div>` : null}
          ${r.result ? html`<div className="rt-small"><b>Then:</b> ${r.result}</div>` : null}
          <div className="rt-small muted">No model was called.</div></div>`));
      }
    } else if (b.k === "node") {
      out.push(sec(`node-${b.n}`, b.n === "ow" ? "Open-weight" : "Frontier", b.n === "ow" ? "ow" : "fr", html`<${RtAttempt} a=${b.a} runId=${runId} />`));
      if (b.n === "fr" && e.outcome && e.outcome.escalated && (rtVal(e, "frontier") || e.checks.some(c => rtCheck(c)[0] === "frontier"))) {
        out.push(sec("frcheck", "Frontier validation (recorded only)", "fr", html`<div>
          <div className="muted rt-small" style=${{ marginTop: 0, marginBottom: 6 }}>Frontier is the last tier, so its answer is kept; the stage's own handling (repair, a second ask, dropping a role) follows.</div>
          <${RtValidationLog} e=${e} tier="frontier" rubric=${rubric} /></div>`));
      }
    } else if (b.k === "checks") {
      out.push(sec("val", "Validation log", e.outcome.escalated ? "esc" : "ok", html`<${RtValidationLog} e=${e} tier="open_weight" rubric=${rubric} />`));
    } else if (b.k === "escalate") {
      const failed = (rtVal(e, "open_weight") || []).filter(c => !c.passed);
      const why = failed.length
        ? `${failed.map(c => names[c.id] || c.id).join(", ")} failed (${failed.map(c => c.id).join(", ")}).`
        : `the open-weight call failed: ${e.outcome.escalationReason || "no response"}.`;
      out.push(sec("esc", "Escalate", "esc", html`<div>
        <div><b>Why:</b> ${why}</div>
        <div className="rt-small"><b>What frontier received:</b> the same prompt${e.inputChars ? ` (${fmt.num(e.inputChars)} characters)` : ""}, sent once.</div>
        <div className="rt-small muted">${ow && ow.seq != null ? html`open-weight <a href=${href(runId, "trace", ow.seq)}>step #${ow.seq}</a>` : null}${fr && fr.seq != null ? html` → frontier <a href=${href(runId, "trace", fr.seq)}>step #${fr.seq}</a>` : null}</div>
      </div>`));
    } else if (b.k === "save") {
      const sv = e.saved, lin = sv.lineage;
      const items = Object.entries(sv.items || {}).map(([k, v]) => `${v} ${k}`).join(", ") || "nothing";
      out.push(sec("save", "Saved", (e.outcome && e.outcome.servedBy === "open_weight") ? "ow" : (e.outcome && e.outcome.servedBy === "rules") ? "" : "fr", html`<div>
        <div><b>${sv.record}</b>: ${items}</div>
        ${lin ? html`<div className="pb-links">${[lin.routerVersion, lin.ruleId, `served by ${rtTier(lin.servedBy)}`, lin.model].map(t => html`<span key=${t} className="pb-link">${t}</span>`)}</div>` : null}
        <div className="muted" style=${{ marginTop: 4 }}>cost ${fmt.usd(e.costUsd)} · all on frontier ${fmt.usd(e.allFrontierUsd)}</div>
      </div>`));
    }
  }
  return html`<section className="rt-now" style=${{ borderLeft: "1px solid var(--border)", minHeight: "100%" }} aria-live="off">
    <div className="dhead"><div>
      <div className="eyebrow">Now routing · #${idx + 1} · ${rtStage(e.stage)}</div>
      <h2 style=${{ marginTop: 2 }}>${rtShort(e)} <span className="pb-link">${e.task}</span></h2>
      ${e.question ? html`<div className="rt-q">${e.question}</div>` : null}
      ${e.inputChars ? html`<div className="muted mono" style=${{ marginTop: 4 }}>prompt ${fmt.num(e.inputChars)} characters</div>` : null}
    </div></div>
    ${out}
  </section>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
