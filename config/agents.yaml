# Agent registry: each agent's innate capabilities, skills, and tools (design-pattern view).
#
# Source specs: Market Manager Agent v0.2 (5.3-5.5), Market Development Controller v0.2 (6.1-6.3),
# Search & Research Sub-controller v0.2 (5.4, 6.1-6.2, Appendix D), Position & Evaluation
# Sub-controller v0.4 (6.3-6.5, Appendix C).
#
# - innate capability: what the agent class does natively (state, queues, rights, lifecycle).
# - skill: reusable competence. kind "model" = a versioned prompt + schema; kind "rule" = a versioned
#   deterministic rule table; kind "mixed" = rules first, then a model judgement on what passes.
#   Each skill lists the trace operations that exercise it.
# - tool: a mechanism the agent calls (store, search, fetch, model gateway).
# Every traced operation must belong to exactly one skill or capability (tests check this).
#
# Plain-language view (the default Agents screen):
# - title / role: the agent as a business reader would describe it. Agents without a title are
#   shown only under Technical details.
# - plain: one sentence in market-manager language. Items without it are shown only under
#   Technical details.
# - knowledge: the playbooks and knowledge the agent draws on (none yet).
# - playbook: the Market Mastery Playbook items this capability or skill already performs, only where
#   the match is real. Display-only until the Phase 2 playbook registry exists.
version: 1
agents:
  - id: market_manager
    name: "Market Manager Agent"
    title: "Market Manager"
    role: "Reviews each market unit with the playbook, decides its Disposition and next step, and keeps the official Position."
    layer: market_manager
    centralQuestion: "Where should Hipstraw direct market-development attention and resources?"
    knowledge: ["The Hipstraw Market Mastery Playbook v0.1 (config/playbook)"]
    innateCapabilities:
      - id: run_lifecycle
        name: "Run lifecycle"
        behavior: "Opens a market run and accepts the mandate's objective documents."
        plain: "Takes the client's mandate and opens a Market Review."
        playbook: ["A03 Store source and provenance"]
        operations: [open_run, ingest_objective]
      - id: market_review
        name: "Market Review"
        behavior: "Reviews Position & Evaluation recommendations and commits the versioned canonical Market Position; the only canonical writer."
        plain: "Signs off the official position on each market unit and keeps every earlier version."
        playbook: ["A01 Register Market Position version"]
        operations: [commit_position]
      - id: governance
        name: "Governance and ledger"
        behavior: "Records decisions with the rule fired, the right used, and lineage; writes the report."
        plain: "Writes the market report, with every decision and the reason for it."
        operations: [write_report]
    skills:
      - id: quick_picker
        name: "Quick picker (Market Review)"
        kind: rule
        version: "playbook.v0.1 + picker.v1"
        purpose: "Playbook §6: seven axes, binding constraint, blocks, stance (§7.1), Strategy (§2.2, §7.2), Play (§7.3, §7.7), Line (§7.4, §7.5), next step, Gambit options (§7.6), Disposition."
        plain: "Reads each market unit's seven axes, names the binding constraint, then picks the stance, strategy, play, line and next step from the playbook and ends with a Disposition."
        playbook: ["§6 Quick picker"]
        operations: [market_review]
      - id: company_review
        name: "Company Review"
        kind: mixed
        version: "review.v1"
        purpose: "Feature 002 rule gate, then a model judgement on records that pass, into include, exclude, or needs_verification."
        plain: "Checks each company found against the mandate's limits, then keeps it, rejects it, or flags it for checking."
        operations: [review_companies, judge_company]
        promptVersions: [review_judgement.v1]
      - id: market_status
        name: "Market status"
        kind: rule
        version: "decide.v1"
        purpose: "Progressing, awaiting-evidence, or blocked across all final paths."
        plain: "Sums up where the whole market stands: progressing, at risk, awaiting evidence, blocked, or needs attention."
        operations: [set_market_status]
    tools:
      - id: market_position_store
        name: "Market Position store"
        purpose: "Versioned canonical Market Position (marketPositions)."
      - id: ledger
        name: "Decision ledger and trace"
        purpose: "Path decisions and trace steps."

  - id: market_development_controller
    name: "Market Development Controller"
    title: "Market Development"
    role: "Decides where to play and draws the market map."
    layer: market_development_controller
    centralQuestion: "Where should we play?"
    knowledge: []
    innateCapabilities:
      - id: graph_semantics
        name: "Graph semantic governance"
        behavior: "Defines what the seed graph means: levels, filters, caps."
        plain: "Sets how a market is broken down: segment, company type, problem, trigger, buyer, use case."
        playbook: ["§2 Market unit"]
        operations: [define_graph_meaning]
      - id: synthesis
        name: "Synthesis"
        behavior: "Synthesizes positions, economics, and search results into the market map."
        plain: "Draws the market map: every market unit found, sized by value and coloured by position."
        operations: [synthesize_market_map]
    skills: []
    tools:
      - id: graph_store
        name: "Graph and frontier service"
        purpose: "Graph meaning and seed graph versions."

  - id: search_research
    name: "Search & Research Sub-controller"
    title: "Research"
    role: "Works out which market units are worth a look and finds the real companies in them."
    layer: search_research
    centralQuestion: "What should we investigate next, and is the evidence sufficient?"
    knowledge: []
    innateCapabilities:
      - id: graph_validation
        name: "Graph validation"
        behavior: "Checks the seed graph's structure against the graph meaning before any scoring."
        plain: "Checks the market breakdown is well formed before anything is scored."
        operations: [validate_graph]
      - id: worker_orchestration
        name: "Worker orchestration"
        behavior: "Runs feature 002 company research as a bounded child run per final path."
        plain: "Sends one company-research task per shortlisted market unit and keeps going if one fails."
        operations: [discover_companies, verify_companies]
    skills:
      - id: vichara
        name: "Research-question decomposition (vichara)"
        kind: model
        version: "vichara.v1"
        purpose: "Answers each grammar dimension from the objective, grounded word for word."
        plain: "Reads the mandate and answers the key questions about the market from it, up to 3 answers each, quoting the mandate."
        operations: [deliberate_dimension]
        promptVersions: [vichara.v1]
      - id: grounding_repair
        name: "Grounding repair"
        kind: model
        version: "vichara_repair.v1"
        purpose: "Repairs answers whose basis is not in the objective (bounded, 3 attempts)."
        operations: [repair_deliberation]
        promptVersions: [vichara_repair.v1]
      - id: coverage_judgement
        name: "Coverage judgement"
        kind: model
        version: "vichara_coverage.v1"
        purpose: "Checks every dimension is addressed."
        operations: [judge_coverage]
        promptVersions: [vichara_coverage.v1]
      - id: hypothesis_proposal
        name: "Hypothesis proposal"
        kind: model
        version: "vichara_propose.v1"
        purpose: "Proposes labelled hypotheses where the objective is silent."
        plain: "Where the mandate says nothing, proposes clearly labelled guesses."
        playbook: ["Hard rule 01 A market hypothesis is not a fact"]
        operations: [propose_hypotheses]
        promptVersions: [vichara_propose.v1]
      - id: seed_graph_design
        name: "Territory map construction"
        kind: model
        version: "graph_level.v2"
        purpose: "Builds the seed graph one level at a time."
        plain: "Breaks the market down into candidate market units."
        playbook: ["M09 Archetype Segmentation"]
        operations: [build_level]
        promptVersions: [graph_level.v1, graph_level.v2]
      - id: link_verification
        name: "Link verification"
        kind: model
        version: "link_verification.v1"
        purpose: "Rationale and link confidence for each edge."
        plain: "Checks that each step in the breakdown makes sense."
        operations: [verify_links]
        promptVersions: [link_verification.v1]
      - id: beam_scoring
        name: "Frontier scoring"
        kind: model
        version: "beam_scoring.v1"
        purpose: "Search score per candidate path: a hypothesis about where to look, not evidence."
        plain: "Scores how promising each market unit looks before any research."
        playbook: ["M14 Portfolio Opportunity Ranking"]
        operations: [score_candidates]
        promptVersions: [beam_scoring.v1]
      - id: shortlisting
        name: "Frontier pruning"
        kind: rule
        version: "beam.v1"
        purpose: "Constraint filters, diversity, beam width, and the minimum search score for final paths."
        plain: "Keeps the best 5 per level with no near-duplicates, then up to 3 final market units scoring 75% or more."
        playbook: ["P01 Territory Prioritization"]
        operations: [prune_level, select_final_paths]
      - id: company_discovery
        name: "Company discovery and verification"
        kind: model
        version: "feature-002"
        purpose: "Query planning, listing extraction, homepage identity, and cited evidence (feature 002)."
        plain: "Finds up to 5 real companies in each shortlisted market unit and checks their websites for cited evidence."
        playbook: ["M06 Audience Source Mapping", "A03 Store source and provenance"]
        operations: [plan_queries, extract_listing, read_homepage, extract_evidence]
        promptVersions: [query_plan.v2, listing_extraction.v2, homepage_identity.v2, company_evidence.v2]
    tools:
      - id: web_search
        name: "Web search (Brave)"
        purpose: "Search results for company discovery."
        plain: "Web search"
        toolCallKinds: [search]
      - id: web_fetch
        name: "Page fetcher"
        purpose: "Reads listing and company pages (robots-aware, denylisted)."
        plain: "Company websites"
        toolCallKinds: [fetch]
      - id: evidence_store
        name: "Evidence store"
        purpose: "Cited evidence with excerpt checks."

  - id: position_evaluation
    name: "Position & Evaluation Sub-controller"
    title: "Evaluation"
    role: "Judges how good each opportunity is, how sure we are, and what should happen next."
    layer: position_evaluation
    centralQuestion: "What should Hipstraw conclude about a candidate, how confident should it be, what remains unknown, and what should happen next?"
    knowledge: []
    innateCapabilities:
      - id: evaluation_process
        name: "Evaluation process management"
        behavior: "Opens an Evaluation Case per final path and moves it through RECEIVED, QUEUED, EVALUATING, NEEDS_RESEARCH or DECIDING, and READY."
        operations: [evaluate_candidate]
      - id: comparison_management
        name: "Comparison set management"
        behavior: "Holds one common basis across candidates; preserves trade-offs and near-ties."
        plain: "Compares opportunities side by side and keeps the trade-offs instead of forcing a winner."
        playbook: ["A15 Prepare decision alternatives"]
        operations: [compare_candidates]
    skills:
      - id: hypothesis_analysis
        name: "Hypothesis and candidate assessment"
        kind: model
        version: "path_assessment.v1"
        purpose: "Seven per-path dimensions, each a hypothesis."
        plain: "Assesses how well each opportunity fits the mandate, across seven questions."
        operations: [assess_path]
        promptVersions: [path_assessment.v1]
      - id: evidence_states
        name: "Evidence assessment"
        kind: rule
        version: "evidence_states.v1"
        purpose: "Sufficiency, quality, and critical unknowns from verified records."
        plain: "Judges whether there is enough evidence and how strong it is."
        playbook: ["A05 Reconcile competing hypothesis evidence"]
        operations: [evaluate_evidence]
      - id: economic_evaluation
        name: "Economic evaluation"
        kind: model
        version: "economic_assessment.v1"
        purpose: "Value-pool range, assumptions, sensitivities, and time to value."
        plain: "Estimates what each opportunity is worth a year, with its assumptions."
        playbook: ["A10 Create comparable territory economics"]
        operations: [screen_economics]
        promptVersions: [economic_assessment.v1]
      - id: buyer_roles
        name: "Buyer-role identification"
        kind: model
        version: "buyer_roles.v2"
        purpose: "Buying functions cited from verified evidence."
        plain: "Identifies who buys, from what the companies' own websites say."
        playbook: ["M17 Buyer Job / Budget Map", "M24 Buying Committee Map"]
        operations: [identify_buyer_roles]
        promptVersions: [buyer_roles.v1, buyer_roles.v2]
      - id: confidence_assessment
        name: "Confidence assessment"
        kind: rule
        version: "confidence.v1"
        purpose: "Confidence from evidence quality, coverage, contradictions, and economic sensitivity; never a model self-rating."
        plain: "Sets how confident we are from the evidence, never from the AI's own opinion."
      - id: position_assessment
        name: "Position transition rubric"
        kind: rule
        version: "position_transition.v1"
        purpose: "Recommend transition, strengthen, validate, investigate, or retire, and issue research requirements."
        plain: "Recommends the next step (enter, strengthen, hold, validate, investigate, weaken, or retire) and what research is still needed."
    tools:
      - id: evidence_store
        name: "Shared evidence store"
        purpose: "Research evidence packets, company records, and evidence documents."
      - id: position_read
        name: "Market Position read interface"
        purpose: "Prior canonical positions (read only)."
      - id: rubric_service
        name: "Rubric service"
        purpose: "Versioned rubrics in code (confidence.v1, position_transition.v1)."

  - id: workers
    name: "Worker swarm"
    layer: workers
    centralQuestion: "Do one bounded task with explicit inputs and a typed output."
    innateCapabilities:
      - id: bounded_execution
        name: "Bounded execution"
        behavior: "One model call, one search, or one fetch per step; typed output; traced with prompt and response."
        operations: [call_model, web_search]
    skills: []
    tools:
      - id: model_gateway
        name: "Model gateway (OpenAI structured outputs)"
        purpose: "Strict-schema model calls: one retry on an invalid response, up to 3 attempts on timeouts and rate limits."
        toolCallKinds: [model]
      - id: web_search
        name: "Web search (Brave)"
        purpose: "Bounded search requests."
        toolCallKinds: [search]

# System terms aligned to The Hipstraw Market Mastery Playbook v0.1 (Appendix A glossary and
# screen names). The playbook is the only source; where it has no term, the row says so.
glossary:
  - term: "Market run"
    playbookTerm: "Market Review"
    meaning: "A governed decision event that reconciles evidence, updates each Position, and sets attention and disposition."
    source: "Playbook glossary"
  - term: "Program config"
    playbookTerm: "Program"
    meaning: "A finite client engagement."
    source: "Playbook glossary"
  - term: "Objective / mandate document"
    playbookTerm: "Mandate"
    meaning: "What the principal authorizes for the engagement, including which execution mode applies to each channel."
    source: "Playbook §5.2"
  - term: "Path"
    playbookTerm: "Market unit"
    meaning: "Principal × offer × buying archetype × job × territory × route × time horizon. Ours do not yet carry route or horizon."
    source: "Playbook glossary"
  - term: "Graph level \"archetype\""
    playbookTerm: "Buying archetype"
    meaning: "The kind of buyer within a market unit. Not a market type (AR01–AR16)."
    source: "Playbook §2"
  - term: "Market Position"
    playbookTerm: "Position"
    meaning: "The evidence-backed, uncertainty-qualified state of one market unit on seven axes (MP1–MP7)."
    source: "Playbook glossary"
  - term: "Path decision"
    playbookTerm: "Disposition"
    meaning: "How a Review ends: EXPLORE, TEST, ACTIVATE, BUILD, SCALE, REFRAME, PARK or STOP, chosen by the quick picker."
    source: "Playbook §2.4"
  - term: "Seed graph"
    playbookTerm: "Territory map"
    meaning: "The territories, jobs and buyers considered before ranking."
    source: "Playbook P01"
  - term: "Beam search"
    playbookTerm: "Opportunity ranking"
    meaning: "Ranking candidate market units and keeping the strongest."
    source: "Playbook M14, P01"
  - term: "Search score"
    playbookTerm: "Search score"
    meaning: "How promising a market unit looks before research. A hypothesis, not evidence."
    source: "No playbook term"
  - term: "Child run (company research)"
    playbookTerm: "Desk research"
    meaning: "Agent-run research that stores sources (A03) and reconciles evidence (A05) for the Market Manager to review. Not a Mission, which is field work where digital research cannot see local reality (L17, A28)."
    source: "Playbook §5.1"
  - term: "Evaluation case"
    playbookTerm: "Evaluation case"
    meaning: "The judgement on one market unit: evidence, value, confidence and recommendation."
    source: "No playbook term"
  - term: "Vichara"
    playbookTerm: "Vichara"
    meaning: "Questions answered from the mandate before anything else."
    source: "No playbook term"
  - term: "Trace"
    playbookTerm: "Activity"
    meaning: "Every logged step with its actor, time, inputs, outputs and receipt."
    source: "Playbook §14"
