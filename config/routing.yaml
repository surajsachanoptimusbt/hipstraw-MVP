# Task router (router.v1). The router is not a model call: it reads this table and a few facts about
# the call (is an open-weight endpoint configured, how large is the input, how many open-weight
# calls in a row have failed in this stage) and picks rules, open_weight or frontier.
# class: rules (code answers it), simple (open-weight first, escalate to frontier when a validator
# fails), complex (frontier). wired: the call site goes through the router today.
version: router.v1
source: Hipstraw proposal, 2026-10-15 meeting direction

openWeight:
  # Policy switch. The endpoint itself comes from OPEN_WEIGHT_BASE_URL, OPEN_WEIGHT_MODEL and
  # OPEN_WEIGHT_API_KEY; with either switch off, every simple task goes to frontier.
  enabled: false
  maxInputChars: 60000
  maxConsecutiveFailures: 3   # call failures (errors, timeouts, unparseable output), not rejected answers
  timeoutSeconds: 60

tasks:
  vichara.v1: {class: simple, wired: true}
  vichara_coverage.v1: {class: complex, wired: true}     # rules candidate, needs sign-off
  vichara_propose.v1: {class: complex, wired: true}
  vichara_repair.v1: {class: complex, wired: false}      # rules candidate, next increment
  graph_level.v2: {class: complex, wired: false}         # labels become Position identity: pinned
  link_verification.v1: {class: simple, wired: false}
  beam_scoring.v1: {class: complex, wired: false}
  path_assessment.v1: {class: complex, wired: false}
  buyer_roles.v2: {class: simple, wired: false}
  economic_assessment.v1: {class: complex, wired: false}
  query_plan.v2: {class: simple, wired: false}
  listing_extraction.v2: {class: simple, wired: false}
  homepage_identity.v2: {class: simple, wired: false}
  company_evidence.v2: {class: complex, wired: false}
  review_judgement.v1: {class: complex, wired: false}

# Prompt files with no call site.
unused: [graph_coverage.v1, graph_repair.v1]
