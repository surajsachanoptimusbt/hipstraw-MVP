- id: P01
  name: Territory Prioritization
  discipline: Explore
  purpose: Choose a small territory from broad plausible demand.
  useWhen: many industries or regions compete for attention
  dontUseWhen: segment economics and access are not comparable
  mustBeTrue: a territory map, jobs, feasible reach, substitutes, stated uncertainties
  stance:
    default: Scout
    allowed:
    - Listen
    - Probe
    never:
    - Activate
    - Expand
  strategy:
    primary: S03
    also:
    - S01
  lines:
    preferredText: L01 → L03
    preferred:
    - L01
    - L03
    alternatives:
    - L19
  gambits: []
  firstStep:
    id: M06
    text: M06 Audience Source Mapping
  whoDecides: Market Manager with the sponsor
  doneWhen: a ranked wedge, excluded alternatives and a testable reason
  example: compare Series B SaaS RevOps teams against “all software firms”
  tip: write down why the losers lost; you will revisit them
