    text: transferability test
  - id: A51
    text: activate a held-out local study
  - id: M51
    text: local compliance and language pilot
  - id: M46
    text: controlled cohort expansion
  - id: M43
    text: rebuild contribution
  - id: M53
    text: scale release gate
  - id: A55
