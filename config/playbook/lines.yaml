- id: L14
  name: Community and Partner Loop
  discipline: Scale
  purpose: Make repeated, mutually useful participation durable.
  startsWhen: trusted nodes and advocates influence adoption
  steps:
  - id: M01
    text: listen to the community
  - id: M21
    text: define reciprocal value
  - id: M27
    text: recruit authentic partners
  - id: M34
    text: convene and serve
  - id: M10
    text: enable an optional action
  - id: M45
    text: track retention
  branches: advocacy turns deceptive or coercive → stop (M55) · no benefit to members → reframe · a community needs
