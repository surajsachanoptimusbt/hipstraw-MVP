  branchIds:
  - M55
  - G03
  window: 6–12 weeks
  stopIf: undisclosed paid advocacy is found
  escalateIf: a member complaint about pressure
  doneWhen: earned repeat participation, trust and attributable referrals
  stance:
    default: Co-create
    allowed:
    - Listen
    never: []
