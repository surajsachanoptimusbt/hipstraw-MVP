# T049: the `us1_targeting` replay scenario (FR-022, research R19). Discovery only: the test runs
# intake, candidates, position, and discover, so there are no verify recordings.
#
#     python tests/fixtures/build_fixtures.py us1_targeting
#
# It reproduces the first live run's failure (run_20261007T140925): an alphabetical A-Z directory whose
# first entries are off-target. Every company, page, and domain is fictional on a `.test` domain.
#
# The model plans the generic A-Z query first; the system must order the metro queries ahead of it.
# 19 candidates are found. Ranking (metroMatch, then positionMatch, then website) must keep exactly:
#   in + strong (9):  Agate Billing, Birch Payables, Cobalt Contracts, Yarrow Spend (A-Z directory),
#                     Fennel Invoice, Garnet Procure (Atlanta list), Hazel Spend, Iris Ledger (Bay Area),
#                     Juniper Payables (New York)
#   in + partial (1): Lupine Labs (Atlanta list), which takes the tenth place
# and drop 9: Aardvark Rides, Abacus Arcade, Quartz Retail, Zinnia Pets (out, weak); Acorn Freight
# (the model says in + strong, but its cited "Buffalo, NY" is outside the metros); Adder Analytics and
# Albatross Apps (no location); Nimbus Ledger (the model claims "Atlanta, GA", but that is not in its
# excerpt; it is Agate's location); Kestrel AP (in, weak).
# If either of the Acorn or Nimbus checks were missing, that company would rank in + strong and push
# Lupine Labs out, so the test can tell.
#
# Page caps (added at the T051 review; the test config sets listingPagesPerSite: 2 and
# listingPagesPerQuery: 3). Reading order after the query reordering: Atlanta, Bay Area, New York,
# then A-Z. The two extra A-Z pages (?page=2, ?page=3) are skipped because list.example.test already
# has 2 pages; the fourth Atlanta result (atl-biz.test) is skipped because the Atlanta query already
# has 3. None of the three has a recording, so reading one would fail the run. The two Atlanta pages
# that are read (atl-weekly.test, atl-tech.test) name no companies.
#
# The company websites are never fetched in this scenario, so they have no pages.

candidateId: invoice_alpha_genesis__saas_recurring_fees
runId: run_20261007T101500
fetchedAt: "2026-10-07T10:15:00+00:00"
model: test-model

