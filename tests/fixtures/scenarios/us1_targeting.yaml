      - url: https://atl-biz.test/top-saas
        title: Top Atlanta SaaS
        snippet: Skipped by the per-query cap.
  - query: San Francisco Bay Area SaaS startups
    purpose: Local press lists of Bay Area SaaS startups
    results:
      - url: https://news.example.test/bay-area-saas-2026
        title: Bay Area SaaS startups to watch in 2026
        snippet: Bay Area SaaS startups to watch.
  - query: New York SaaS companies to watch
    purpose: Local press lists of New York SaaS companies
    results:
      - url: https://news.example.test/new-york-saas-2026
        title: New York SaaS companies to watch
        snippet: New York SaaS companies to watch.

