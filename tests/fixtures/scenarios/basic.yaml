# T032: the `basic` replay scenario. Rebuild the recordings after editing this file:
#
#     python tests/fixtures/build_fixtures.py basic
#
# Every company, page, and domain here is fictional and uses a reserved `.test` domain (Constitution IX).
#
# What each company exercises:
#   Alpha Ledger        listing_link     every excerpt verbatim                    -> include
#   Beta Billing        profile_hop      every excerpt verbatim                    -> include
#   Epsilon Pay         direct_homepage  verbatim; the page uses an en dash        -> include
#   Gamma Ops           listing_link     every evidence excerpt is a paraphrase    -> needs_verification
#   Delta None          listing_link     website returns 404                       -> exclude
#   Sigma Scale         listing_link     verbatim; "5,000+ employees" (over size)  -> exclude by rule
#   Theta Works         listing_link     verbatim; headquartered in Chicago, IL    -> exclude by rule
#   Zeta Holdings LLC   registry_only    no website                                -> needs_verification
#   Alpha Ledger, Inc.  registry page    dropped by the merge rule (same normalized name as Alpha Ledger)
#
# Recordings that are deliberately absent, so calling them raises ReplayMissingError:
#   - any fetch of linkedin.com (denylisted search result) or of kappa-cloud.test (an external link on
#     Alpha Ledger's homepage, which is not an own-site page);
#   - CompanyEvidence for delta-none.test (its website does not load);
#   - ReviewJudgement for Gamma, Delta, Sigma, Theta, and Zeta (the rule gate decides them).
#
# Alpha Ledger's listing entry wraps its name in <strong>, so its excerpt only matches if inline tags
# do not break the page text into separate lines.

candidateId: invoice_alpha_genesis__saas_recurring_fees
# Tests fix the clock at 2026-10-07T10:15:00Z, so this is the run's ID. Judgement match keys use it.
runId: run_20261007T101500
fetchedAt: "2026-10-07T10:15:00+00:00"
model: test-model

