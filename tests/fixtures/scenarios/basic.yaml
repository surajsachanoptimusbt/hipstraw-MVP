        snippet: Denylisted; the search adapter drops this result.
      - url: https://list.example.test/atlanta-saas
        title: Atlanta B2B SaaS companies
        snippet: A directory of software companies in the Atlanta area.
  - query: Atlanta recurring vendor invoice payments software
    purpose: Company homepages that mention recurring vendor invoices
    results:
      - url: https://epsilon-pay.test/
        title: Epsilon Pay
        snippet: Pay recurring vendor invoices on time.

