# CompanyEvidence responses (match key: domain). `pages` is the order the verify step gives the model
# its pages: the homepage first, then the own-site pages in the order the homepage links to them. The
# builder numbers them s1, s2, ... and turns each claim's `page` into that sourceId.
# `verbatim: true` claims must pass the citation check; `verbatim: false` claims must fail it.
evidence:
  alpha-ledger.test:
    pages: [https://alpha-ledger.test/, https://alpha-ledger.test/about, https://alpha-ledger.test/careers]
    claims:
      - {claimId: c1, claimField: hq, claimValue: "Atlanta, GA", page: https://alpha-ledger.test/about, verbatim: true,
         excerpt: "Alpha Ledger is headquartered in Atlanta, GA."}
      - {claimId: c2, claimField: employees, claimValue: "120", page: https://alpha-ledger.test/about, verbatim: true,
         excerpt: "Our team has 120 employees across finance, sales, and engineering."}
      - {claimId: c3, claimField: fit_problem, claimValue: "vendor invoices and SaaS subscriptions to track",
         page: https://alpha-ledger.test/careers, verbatim: true,
         excerpt: "We are hiring an Accounts Payable Specialist to process vendor invoices and track our SaaS subscriptions."}
      - {claimId: c4, claimField: signal_pain, claimValue: "Accounts Payable Specialist hiring",
         page: https://alpha-ledger.test/careers, verbatim: true,
         excerpt: "We are hiring an Accounts Payable Specialist to process vendor invoices and track our SaaS subscriptions."}
    fitClaims:
      - aspect: problem
        statement: Alpha Ledger processes a growing volume of vendor invoices and SaaS subscriptions.
        primaryInterestIds: [invoice_accuracy_entitlement]
        claimIds: [c3]
    interestSignals:
      - {kind: pain, statement: Hiring an Accounts Payable Specialist to process vendor invoices., claimIds: [c4]}
    falsifier: Alpha Ledger is a subsidiary of a large enterprise, or has 500 or more employees.

