# T049: the `us1_sites` replay scenario: websites that exist but cannot be read, websites that do not
# exist, and name-domain mismatches (FR-008, FR-013, FR-016, research R4, revised 2026-10-07).
#
#     python tests/fixtures/build_fixtures.py us1_sites
#
# Every company, page, and domain is fictional on a `.test` domain (Constitution IX).
#
#   Lark Robots             robots.txt disallows the whole site   -> unreadable -> needs_verification
#   Maple Forbidden         homepage answers HTTP 403             -> unreadable -> needs_verification
#   Nettle Throttle         homepage answers HTTP 429             -> unreadable -> needs_verification
#   Rowan Down              homepage answers HTTP 503             -> unreadable -> needs_verification
#   Oxbow Gone              homepage answers HTTP 410             -> fails      -> exclude
#   Pine Nowhere            host name does not resolve (DNS)      -> fails      -> exclude
#   Larch Health Systems    website quillpad.test names it        -> existence passes; include
#   Sorrel Analytics        website tallyhub.test does not        -> needs_verification, both named
#   Teasel Systems          website brightform.test names it only on its about page (FR-016, added
#                           at the T051 review)                     -> existence passes; include
#
# Discovery also sees a linkedin.com result (denylisted) and a listing page that robots.txt
# disallows (/private/...). Neither is ever fetched: they have no page recordings. Nine companies
# are kept, so the shortfall is 1.
#
# Recordings that are deliberately absent, so calling them raises ReplayMissingError:
#   - any page on lark-robots.test or pine-nowhere.test, and anything past the homepage of the
#     403, 429, 503, and 410 sites;
#   - CompanyEvidence and signal searches for every website that is unreadable or fails;
#   - ReviewJudgement for every company except Larch Health Systems and Teasel Systems.

candidateId: invoice_alpha_genesis__saas_recurring_fees
runId: run_20261007T101500
fetchedAt: "2026-10-07T10:15:00+00:00"
model: test-model

queries:
