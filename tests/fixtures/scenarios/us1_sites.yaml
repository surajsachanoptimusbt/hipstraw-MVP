         page: https://quillpad.test/careers, verbatim: true,
         excerpt: "Larch Health Systems is hiring an Accounts Payable Coordinator to manage vendor invoices for our SaaS tools."}
      - {claimId: c4, claimField: signal_pain, claimValue: "Accounts Payable Coordinator hiring",
         page: https://quillpad.test/careers, verbatim: true,
         excerpt: "Larch Health Systems is hiring an Accounts Payable Coordinator to manage vendor invoices for our SaaS tools."}
    fitClaims:
      - aspect: problem
        statement: Larch Health Systems manages vendor invoices for its SaaS tools.
        primaryInterestIds: [invoice_accuracy_entitlement]
        claimIds: [c3]
    interestSignals:
      - {kind: pain, statement: Hiring an Accounts Payable Coordinator for SaaS vendor invoices., claimIds: [c4]}
    falsifier: Larch Health Systems is a subsidiary of a large enterprise, or has 500 or more employees.

