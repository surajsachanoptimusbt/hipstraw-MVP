# T049: the `us1` replay scenario: complete company records (US1 acceptance scenarios 1-8), the
# parent-company check (T053), signal searches (T056), confidence (T054), and cited-ID validation
# (T065).
#
#     python tests/fixtures/build_fixtures.py us1
#
# Every company, person, page, and domain is fictional on a `.test` domain (Constitution IX).
#
#   Palisade Ledger   Palo Alto, CA; exploration signal; press quote naming a person;
#                     also names a New York sales office, which is not its headquarters -> include
#   Quarry Spend      450 employees (about) and 620 (press)                          -> needs_verification
#   Ridge Books       no interest signal                                             -> needs_verification
#   Saffron Bill      sourced AP-hiring signal; unsourced "heavy recurring SaaS spend"
#                     signal (A1, dropped); a fit excerpt holding an email address     -> include
#   Tamarack AP       its only signal is on a job-board page found by a signal search  -> include
#   Umber Freight     listed as New York, but its own site cites Buffalo, NY           -> exclude
#   Vetch Payments    subsidiary of Omega Conglomerate (on largeEnterpriseParents)     -> exclude
#   Willow Invoice    part of the Pelican Group, size unknown                         -> needs_verification
#   Xenon Contracts   subsidiary of Heron Holdings, cited with 12,000 employees        -> exclude
#   Yucca Procure     its judgement cites an evidence ID that does not exist           -> needs_verification
#
# Recordings that are deliberately absent, so calling them raises ReplayMissingError:
#   - any fetch of the denylisted jobs.linkedin.com result;
#   - ReviewJudgement for every company the rule gate decides (Quarry, Ridge, Umber, Vetch, Willow,
#     Xenon).

