# Scenario 1 (Oct 30 meeting): one channel, email. The Kozmo Invoice Alpha Genesis Cohort campaign in the US,
# aimed at the New York, San Francisco and Atlanta metros, sent to Kozmo's own opted-in list. The email copy
# is a sample draft written for this demo; the landing page is Kozmo's real program page.
# docs/campaign_channel_scenarios.md walks through what Hipstraw checks and why.
product:
  name: "Kozmo Invoice Alpha"
  description: >-
    Continuous obligation intelligence: checks every supplier invoice against the contract before payment,
    protects entitlements and prevents leakage.
  website: "https://kozmo.ai/invoice-alpha-genesis.html"
audience:
  description: >-
    Heads of Accounts Payable and Procurement at startups and mid-market companies (50 to 2,000 employees)
    with recurring SaaS, services and supplier spend, in the New York, San Francisco and Atlanta metro areas
  segments: ["AP managers", "Procurement leads", "Finance controllers"]
market: US
dayZero: 2026-11-10
objective:
  statement: "Recruit 15 companies into the Invoice Alpha Genesis Cohort"
  successMeasure: "Qualified cohort applications from campaign traffic"
strategy:
  message: "Your contracts say one price. Your invoices say another. Kozmo catches the gap before you pay."
  offer: "Join the Genesis Cohort: a free invoice-against-contract check of your last 90 days of supplier invoices"
  budget: {amount: 1500, currency: USD}
authorizedChannels: []
approver: "Kozmo GTM lead"
trackingPlan: "UTM tags per channel; cohort applications tracked in the CRM"
# The landing page every channel sends people to: Kozmo's real program page, its copy pasted as the Sponsor would
# supply it (Cloudflare refuses automated reads; M02 records that as an unknown).
assets:
  - kind: landing_page
    url: "https://kozmo.ai/invoice-alpha-genesis.html"
    text: |-
      Commercial Program 01 / Invoice Alpha
      Make the invoice confirmation, not discovery.
      Invoice Alpha is an 8-week Genesis Cohort for procurement, AP, finance and commercial leaders exploring how AI and agents can maintain the obligation continuously — across contracts, POs, delivery, performance and supplier context — so teams can detect divergence earlier, protect entitlements, prevent leakage and decide what should be paid before payment pressure takes over.
