# SIMULATION launch (Nov 2 meeting): Kozmo's Genesis Cohort campaign aimed at one micro-market from the market
# discovery work, Atlanta IT-services and software-services companies. The landing page is Kozmo's real program
# page; the email and ad copy, the lists and the targeting are written for this simulation. Its live numbers come
# from input/campaign/simulations/kozmo_atlanta_14_days.yaml, never from Kozmo or a platform.
product:
  name: "Kozmo Invoice Alpha"
  description: >-
    Continuous obligation intelligence: checks every supplier invoice against the contract before payment,
    protects entitlements and prevents leakage.
  website: "https://kozmo.ai/invoice-alpha-genesis.html"
audience:
  description: >-
    Finance, AP and procurement leaders at Atlanta-metro IT services and software services companies (managed
    services, IT consulting, SaaS resellers) with 50 to 500 employees and heavy recurring supplier and SaaS spend
  segments: ["Controllers", "AP managers", "Procurement leads"]
market: US
dayZero: 2026-11-10
objective:
  statement: "Recruit 5 Atlanta IT-services companies into the Invoice Alpha Genesis Cohort"
  successMeasure: "Qualified cohort applications from campaign traffic"
strategy:
  message: "Your contracts say one price. Your invoices say another. Kozmo catches the gap before you pay."
  offer: "Join the Genesis Cohort: a free invoice-against-contract check of your last 90 days of supplier invoices"
  budget: {amount: 6000, currency: USD}
authorizedChannels: []
approver: "Kozmo GTM lead"
trackingPlan: "UTM tags per channel; cohort applications and their role and company size tracked in the CRM"
assets:
  - kind: landing_page
    url: "https://kozmo.ai/invoice-alpha-genesis.html"
    text: |-
      Commercial Program 01 / Invoice Alpha
      Make the invoice confirmation, not discovery.
      Invoice Alpha is an 8-week Genesis Cohort for procurement, AP, finance and commercial leaders exploring how AI and agents can maintain the obligation continuously — across contracts, POs, delivery, performance and supplier context — so teams can detect divergence earlier, protect entitlements, prevent leakage and decide what should be paid before payment pressure takes over.
      Request a spot →
      ProcurementAP / P2PFinanceCommercialSupplier Management
      Live obligation position
      Continuously evaluated
